name: evals

# Behavioral regression gate. A skill is a prompt, so an edit to SKILL.md is a
# config change with no compiler to catch it; this runs the skill's eval suite
# against the edit before it merges. Only skills that ship an evals/ directory
# are run, and only when their SKILL.md or evals changed.

on:
  pull_request:
    paths:
      - "skills/*/SKILL.md"
      - "skills/*/evals/**"
  workflow_dispatch:
    inputs:
      skills:
        description: "Space-separated skill names to evaluate (blank = every skill with evals/)"
        required: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick skills to evaluate
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.skills }}" ]; then
              list="${{ inputs.skills }}"
            else
              list=$(ls -d skills/*/evals 2>/dev/null | cut -d/ -f2 | tr '\n' ' ')
            fi
          else
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- skills | cut -d/ -f2 | sort -u)
            list=""
            for s in $changed; do [ -d "skills/$s/evals" ] && list="$list $s"; done
          fi
          echo "skills=$(echo $list)" >> "$GITHUB_OUTPUT"
          echo "Evaluating: ${list:-<none>}"

      - name: No API key configured
        if: env.HAS_KEY != 'true' && steps.pick.outputs.skills != ''
        run: echo "::warning::ANTHROPIC_API_KEY secret is not set; skipping evals for ${{ steps.pick.outputs.skills }}."

      - uses: oven-sh/setup-bun@v2
        if: env.HAS_KEY == 'true' && steps.pick.outputs.skills != ''

      - name: Install Claude Code and the shell sandbox
        if: env.HAS_KEY == 'true' && steps.pick.outputs.skills != ''
        run: |
          bun install -g @anthropic-ai/claude-code
          # Suites that grant Bash run under Claude Code's OS sandbox, which on
          # Linux needs bubblewrap + socat and unprivileged user namespaces.
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          claude --version

      - name: Run eval suites
        if: env.HAS_KEY == 'true' && steps.pick.outputs.skills != ''
        run: |
          status=0
          mkdir -p eval-results
          for s in ${{ steps.pick.outputs.skills }}; do
            echo "::group::$s"
            # --ablation none: CI gates on the with-skill score only; run the
            # with/without comparison locally when tuning a skill.
            # --scaffold: fixture scripts are this repo's own code.
            claude plugin eval "skills/$s" \
              --trust-plugin --no-publish --scaffold --ablation none \
              --allow-tools Bash Write \
              --threshold 0.8 --max-cost-usd 6 \
              --json "eval-results/$s.json" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Upload results
        if: always() && env.HAS_KEY == 'true' && steps.pick.outputs.skills != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval-results/
            skills/*/evals/results/
          if-no-files-found: ignore
